<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北海道議会情報マップ - 千歳市</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: #f5f6f8;
      color: #222;
      min-height: 100vh;
    }

    /* ヘッダー */
    header {
      background: #1a3a6c;
      color: #fff;
      padding: 20px 24px;
    }
    header .site-name {
      font-size: 0.8rem;
      opacity: 0.75;
      margin-bottom: 4px;
      letter-spacing: 0.05em;
    }
    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    header .subtitle {
      font-size: 0.8rem;
      opacity: 0.65;
      margin-top: 4px;
    }

    /* メインコンテンツ */
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    /* フィルター */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      align-items: center;
    }
    .filter-bar label {
      font-size: 0.85rem;
      color: #555;
      white-space: nowrap;
    }
    .filter-bar select {
      font-size: 0.85rem;
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }
    .filter-bar select:focus {
      outline: none;
      border-color: #1a3a6c;
    }
    #member-count {
      margin-left: auto;
      font-size: 0.8rem;
      color: #777;
    }

    /* カードグリッド */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    /* 議員カード */
    .card {
      background: #fff;
      border-radius: 10px;
      border: 1px solid #e4e6ea;
      padding: 16px 18px;
      transition: box-shadow 0.15s, transform 0.15s;
    }
    .card:hover {
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
      transform: translateY(-2px);
    }

    .card-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 10px;
    }
    .seat-number {
      font-size: 0.7rem;
      color: #888;
      background: #f0f2f5;
      border-radius: 4px;
      padding: 2px 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .member-name {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.3;
    }
    .member-furigana {
      font-size: 0.72rem;
      color: #999;
      margin-top: 1px;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 10px;
    }
    .info-row {
      display: flex;
      gap: 8px;
      font-size: 0.82rem;
    }
    .info-label {
      color: #888;
      white-space: nowrap;
      flex-shrink: 0;
      width: 2.8em;
    }
    .info-value {
      color: #333;
    }

    /* 会派バッジ */
    .faction-badge {
      display: inline-block;
      font-size: 0.78rem;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
    }

    /* 委員会タグ */
    .committee-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .committee-tag {
      font-size: 0.72rem;
      background: #eef2fb;
      color: #3a5ca8;
      border-radius: 4px;
      padding: 2px 7px;
    }
    .no-committee {
      font-size: 0.78rem;
      color: #bbb;
    }

    /* 空状態 */
    .empty-state {
      text-align: center;
      padding: 48px 0;
      color: #aaa;
      font-size: 0.9rem;
    }

    /* フッター */
    footer {
      text-align: center;
      padding: 24px;
      font-size: 0.75rem;
      color: #aaa;
      border-top: 1px solid #e4e6ea;
      margin-top: 24px;
    }
    footer a { color: #888; }

    @media (max-width: 480px) {
      header h1 { font-size: 1.15rem; }
      .card-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <div class="site-name">北海道議会情報マップ</div>
  <h1>千歳市議会 議員一覧</h1>
  <div class="subtitle">令和7年12月現在 · 議員定数 23名</div>
</header>

<main>
  <div class="filter-bar">
    <label for="faction-filter">会派で絞り込み</label>
    <select id="faction-filter">
      <option value="">すべて</option>
    </select>
    <span id="member-count"></span>
  </div>

  <div class="card-grid" id="card-grid">
    <div class="empty-state">読み込み中...</div>
  </div>
</main>

<footer>
  データ出典: <a href="https://www.city.chitose.lg.jp/docs/30520.html" target="_blank" rel="noopener">千歳市議会公式サイト</a>
  &nbsp;|&nbsp;
  <a href="https://github.com/gyawa24/gikai-map-hokkaido" target="_blank" rel="noopener">GitHub</a>
</footer>

<script>
  // 会派ごとの色設定
  const FACTION_COLORS = {
    "自民党議員会":         { bg: "#fff3e0", text: "#b45309" },
    "自民の会":             { bg: "#fef9c3", text: "#92400e" },
    "公明党議員団":         { bg: "#eff6ff", text: "#1d4ed8" },
    "ちとせ未来クラブ":     { bg: "#f0fdf4", text: "#166534" },
    "日本共産党":           { bg: "#fef2f2", text: "#b91c1c" },
    "参政党":               { bg: "#fdf4ff", text: "#7c3aed" },
    "無所属クラブ（維新・市民）": { bg: "#ecfeff", text: "#0e7490" },
    "無所属":               { bg: "#f1f5f9", text: "#475569" },
  };

  function factionStyle(faction) {
    const c = FACTION_COLORS[faction] || { bg: "#f1f5f9", text: "#475569" };
    return `background:${c.bg}; color:${c.text};`;
  }

  function renderCard(member) {
    const committees = member.committees.length > 0
      ? member.committees.map(c => `<span class="committee-tag">${c}</span>`).join("")
      : `<span class="no-committee">―</span>`;

    return `
      <div class="card" data-faction="${escapeHtml(member.faction)}">
        <div class="card-header">
          <span class="seat-number">${member.seat_number}番</span>
          <div>
            <div class="member-name">${escapeHtml(member.name)}</div>
            <div class="member-furigana">${escapeHtml(member.furigana)}</div>
          </div>
        </div>
        <div class="card-body">
          <div class="info-row">
            <span class="info-label">会派</span>
            <span class="info-value">
              <span class="faction-badge" style="${factionStyle(member.faction)}">${escapeHtml(member.faction)}</span>
            </span>
          </div>
          <div class="info-row">
            <span class="info-label">委員会</span>
            <span class="info-value">
              <div class="committee-list">${committees}</div>
            </span>
          </div>
        </div>
      </div>`;
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function renderGrid(members) {
    const grid = document.getElementById("card-grid");
    const count = document.getElementById("member-count");
    if (members.length === 0) {
      grid.innerHTML = `<div class="empty-state">該当する議員が見つかりません</div>`;
      count.textContent = "";
      return;
    }
    grid.innerHTML = members.map(renderCard).join("");
    count.textContent = `${members.length} 名`;
  }

  async function init() {
    let members;
    try {
      const res = await fetch("data/chitose/members.json");
      if (!res.ok) throw new Error(res.statusText);
      members = await res.json();
    } catch (e) {
      document.getElementById("card-grid").innerHTML =
        `<div class="empty-state">データの読み込みに失敗しました。<br><small>${e.message}</small></div>`;
      return;
    }

    // 会派フィルター選択肢を生成
    const factions = [...new Set(members.map(m => m.faction))];
    const select = document.getElementById("faction-filter");
    factions.forEach(f => {
      const opt = document.createElement("option");
      opt.value = f;
      opt.textContent = f;
      select.appendChild(opt);
    });

    renderGrid(members);

    select.addEventListener("change", () => {
      const val = select.value;
      const filtered = val ? members.filter(m => m.faction === val) : members;
      renderGrid(filtered);
    });
  }

  init();
</script>
</body>
</html>
